<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" width="850" height="500">
  <rect width="100%" height="100%" fill="#FFFBEB"/>
  <text x="425" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#78350F">CƠ CHẾ VI MÔI TRƯỜNG DỊCH NANG ĐỘC HẠI CỦA ENDOMETRIOMA (OMA)</text>
  
  <!-- Flow steps -->
  <!-- Step 1 -->
  <rect x="50" y="80" width="220" height="150" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="160" y="110" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#92400E">1. TÍCH TỤ SẮT TỰ DO</text>
  <text x="65" y="140" font-family="Arial" font-size="13" fill="#78350F">• Xuất huyết chu kỳ trong u</text>
  <text x="65" y="162" font-family="Arial" font-size="13" fill="#78350F">• Dịch sô-cô-la chứa nồng độ</text>
  <text x="65" y="184" font-family="Arial" font-size="13" font-weight="bold" fill="#B45309">Sắt tự do (Fe2+) cực cao</text>
  
  <!-- Arrow 1 -->
  <path d="M 280 155 L 320 155" stroke="#B45309" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Step 2 -->
  <rect x="330" y="80" width="220" height="150" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
  <text x="440" y="110" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#991B1B">2. PHẢN ỨNG FENTON</text>
  <text x="345" y="140" font-family="Arial" font-size="13" fill="#7F1D1D">• Fe2+ + H2O2 → Gốc •OH (ROS)</text>
  <text x="345" y="162" font-family="Arial" font-size="13" fill="#7F1D1D">• Bùng phát stress oxy hóa</text>
  <text x="345" y="184" font-family="Arial" font-size="13" font-weight="bold" fill="#DC2626">• Cytokine viêm: TNF-α, IL-6, IL-8</text>
  
  <!-- Arrow 2 -->
  <path d="M 560 155 L 600 155" stroke="#DC2626" stroke-width="4" fill="none"/>
  
  <!-- Step 3 -->
  <rect x="610" y="80" width="200" height="150" rx="10" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
  <text x="710" y="110" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#6B21A8">3. TỔN THƯƠNG NOÃN</text>
  <text x="625" y="140" font-family="Arial" font-size="13" fill="#581C87">• Đứt gãy thoi vô sắc</text>
  <text x="625" y="162" font-family="Arial" font-size="13" fill="#581C87">• Phân mảnh DNA giao tử</text>
  <text x="625" y="184" font-family="Arial" font-size="13" font-weight="bold" fill="#7E22CE">• Giảm tỷ lệ tạo phôi nang</text>

  <!-- Impact on Cortical Stroma -->
  <rect x="50" y="270" width="760" height="160" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="430" y="305" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1E40AF">TÁC ĐỘNG LÊN NHU MÔ VỎ BUỒNG TRỨNG XUNG QUANH (CORTICAL STROMA)</text>
  <text x="80" y="340" font-family="Arial" font-size="14" fill="#1E3A8A">1. **Xơ hóa mô vỏ buồng trứng (Cortical Fibrosis):** Viêm mạn tính kích thích lắng đọng collagen, làm cứng mô đệm.</text>
  <text x="80" y="370" font-family="Arial" font-size="14" fill="#1E3A8A">2. **Thiếu máu nuôi vi mạch:** Các mạch máu rốn buồng trứng bị chèn ép và xơ cứng.</text>
  <text x="80" y="400" font-family="Arial" font-size="14" font-weight="bold" fill="#B91C1C">3. **Cạn kiệt nang noãn nguyên thủy ("Burnout" Effect):** Nang noãn bị kích hoạt bất thường rồi thoái hóa hàng loạt (Giảm AMH &amp; AFC).</text>
</svg>