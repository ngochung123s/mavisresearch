<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480">
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <text x="460" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0F172A">PHÁC ĐỒ ULTRA-LONG GNRH AGONIST CHUẨN BỊ NIÊM MẠC CHUYỂN PHÔI FET</text>
  
  <!-- Phase 1: Downregulation -->
  <rect x="40" y="70" width="340" height="360" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="210" y="100" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#1E40AF">GIAI ĐOẠN 1: HẠ ĐIỀU HÒA TUYẾN YÊN</text>
  
  <rect x="60" y="125" width="300" height="60" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="75" y="150" font-family="Arial" font-size="13" font-weight="bold" fill="#1E3A8A">• Mũi 1 (Ngày 1-3 chu kỳ):</text>
  <text x="75" y="170" font-family="Arial" font-size="12" fill="#334155">Tiêm bắp GnRHa Depot 3.75 mg (Triptorelin/Leuprolide)</text>

  <rect x="60" y="195" width="300" height="60" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="75" y="220" font-family="Arial" font-size="13" font-weight="bold" fill="#1E3A8A">• Mũi 2 (Sau 28 ngày):</text>
  <text x="75" y="240" font-family="Arial" font-size="12" fill="#334155">Tiêm bắp GnRHa Depot 3.75 mg lần 2</text>

  <rect x="60" y="265" width="300" height="60" rx="6" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="75" y="290" font-family="Arial" font-size="13" font-weight="bold" fill="#1E3A8A">• Mũi 3 (Sau 28 ngày - Nếu lan tỏa nặng):</text>
  <text x="75" y="310" font-family="Arial" font-size="12" fill="#334155">Tiêm bắp GnRHa Depot 3.75 mg lần 3</text>

  <rect x="60" y="340" width="300" height="70" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="210" y="365" font-family="Arial" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400E">ĐÁNH GIÁ LẠI (CLINICAL PEARL):</text>
  <text x="210" y="390" font-family="Arial" font-size="12" text-anchor="middle" fill="#78350F">Siêu âm kiểm tra tử cung co nhỏ &amp; JZ &lt; 12mm đạt chuẩn</text>

  <!-- Phase 2: HRT & LPS -->
  <rect x="420" y="70" width="460" height="360" rx="12" fill="#FDF2F8" stroke="#EC4899" stroke-width="2"/>
  <text x="650" y="100" font-family="Arial" font-size="15" font-weight="bold" text-anchor="middle" fill="#9D174D">GIAI ĐOẠN 2: CHUẨN BỊ NỘI MẠC &amp; HOÀNG THỂ</text>

  <rect x="440" y="125" width="420" height="75" rx="6" fill="#FFFFFF" stroke="#F472B6"/>
  <text x="455" y="150" font-family="Arial" font-size="13" font-weight="bold" fill="#831843">1. Chuẩn bị Nội mạc bằng Estrogen (HRT):</text>
  <text x="455" y="172" font-family="Arial" font-size="12" fill="#334155">• Bắt đầu sau mũi GnRHa cuối 28 ngày: Uống Estradiol 4-6 mg/ngày</text>
  <text x="455" y="190" font-family="Arial" font-size="12" fill="#831843">• Mục tiêu: Niêm mạc dày ≥ 8 mm, cấu trúc 3 lá (triple-line)</text>

  <rect x="440" y="210" width="420" height="85" rx="6" fill="#FFFFFF" stroke="#F472B6"/>
  <text x="455" y="235" font-family="Arial" font-size="13" font-weight="bold" fill="#831843">2. Tối ưu hóa Luteal Phase Support (LPS):</text>
  <text x="455" y="257" font-family="Arial" font-size="12" fill="#334155">• Phối hợp Progesterone âm đạo (800 mg) + Tiêm bắp/dưới da (50 mg)</text>
  <text x="455" y="277" font-family="Arial" font-size="12" font-weight="bold" fill="#BE185D">• Kiểm tra P4 huyết thanh ngày chuyển phôi &gt; 10 - 15 ng/mL</text>

  <rect x="440" y="305" width="420" height="105" rx="8" fill="#F0FDF4" stroke="#22C55E"/>
  <text x="650" y="335" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803D">CHUYỂN PHÔI ĐÔNG LẠNH (FET)</text>
  <text x="650" y="360" font-family="Arial" font-size="12" text-anchor="middle" fill="#166534">• Chuyển phôi sau đúng 120 giờ tiếp xúc Progesterone (Phôi ngày 5)</text>
  <text x="650" y="385" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#15803D">• Tỷ lệ làm tổ và trẻ sinh sống phục hồi tối đa</text>
</svg>