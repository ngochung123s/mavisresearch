<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="850" height="480">
  <rect width="100%" height="100%" fill="#F0FDF4"/>
  <text x="425" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#166534">QUY TRÌNH 4 BƯỚC TIÊM XƠ BẰNG CỒN (ETHANOL SCLEROTHERAPY - EST)</text>
  
  <!-- Step 1 -->
  <rect x="40" y="75" width="175" height="340" rx="10" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
  <circle cx="127" cy="115" r="22" fill="#DCFCE7"/>
  <text x="127" y="122" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#15803D">1</text>
  <text x="127" y="160" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#166534">CHỌC HÚT DỊCH</text>
  <text x="55" y="195" font-family="Arial" font-size="12" fill="#334155">• Chọc kim qua ngả âm đạo dưới hướng dẫn siêu âm</text>
  <text x="55" y="240" font-family="Arial" font-size="12" fill="#334155">• Hút triệt để toàn bộ dịch sô-cô-la sánh trong u OMA</text>
  <text x="55" y="285" font-family="Arial" font-size="12" fill="#334155">• Đo lường chính xác thể tích dịch hút ra (V_hút)</text>

  <!-- Step 2 -->
  <rect x="235" y="75" width="175" height="340" rx="10" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
  <circle cx="322" cy="115" r="22" fill="#DCFCE7"/>
  <text x="322" y="122" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#15803D">2</text>
  <text x="322" y="160" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#166534">BƠM RỬA NANG</text>
  <text x="250" y="195" font-family="Arial" font-size="12" fill="#334155">• Bơm nước muối sinh lý NaCl 0.9% vào lòng nang</text>
  <text x="250" y="240" font-family="Arial" font-size="12" fill="#334155">• Rửa lặp lại 2-3 lần đến khi dịch hút ra trong</text>
  <text x="250" y="285" font-family="Arial" font-size="12" fill="#334155">• Đảm bảo sạch cặn máu thoái hóa bám dính thành</text>

  <!-- Step 3 -->
  <rect x="430" y="75" width="185" height="340" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <circle cx="522" cy="115" r="22" fill="#FEE2E2"/>
  <text x="522" y="122" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#B91C1C">3</text>
  <text x="522" y="160" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#991B1B">BƠM CỒN 95-99%</text>
  <text x="445" y="195" font-family="Arial" font-size="12" fill="#7F1D1D">• Bơm cồn y tế 95-99% (thể tích ~ 60-80% V_hút)</text>
  <text x="445" y="240" font-family="Arial" font-size="12" font-weight="bold" fill="#DC2626">• Ngâm lưu cồn trong nang 10 - 15 phút</text>
  <text x="445" y="285" font-family="Arial" font-size="12" fill="#7F1D1D">• Cồn làm đông vón protein và phá hủy lớp biểu mô chế tiết</text>

  <!-- Step 4 -->
  <rect x="635" y="75" width="175" height="340" rx="10" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
  <circle cx="722" cy="115" r="22" fill="#DCFCE7"/>
  <text x="722" y="122" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#15803D">4</text>
  <text x="722" y="160" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#166534">HÚT SẠCH CỒN</text>
  <text x="650" y="195" font-family="Arial" font-size="12" fill="#334155">• Hút cạn toàn bộ lượng cồn đã bơm vào nang</text>
  <text x="650" y="240" font-family="Arial" font-size="12" fill="#334155">• Tuyệt đối không để cồn rò rỉ ra ổ bụng / phúc mạc</text>
  <text x="650" y="285" font-family="Arial" font-size="12" font-weight="bold" fill="#15803D">• Bảo tồn tối đa mô buồng trứng lành xung quanh</text>
</svg>