<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <rect width="100%" height="100%" fill="#F8FAFC"/>
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0F172A">ĐỒNG THUẬN QUỐC TẾ MUSA (2015): TIÊU CHUẨN SIÊU ÂM ADENOMYOSIS</text>
  
  <!-- Direct Signs Box -->
  <rect x="40" y="70" width="395" height="390" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="237" y="105" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#1E40AF">DẤU HIỆU TRỰC TIẾP (DIRECT SIGNS)</text>
  <text x="237" y="128" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#3B82F6">Có giá trị khẳng định mô bệnh học</text>
  
  <rect x="60" y="145" width="355" height="65" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="75" y="170" font-family="Arial" font-size="13" font-weight="bold" fill="#1E3A8A">1. Nang cơ tử cung (Myometrial Cysts)</text>
  <text x="75" y="192" font-family="Arial" font-size="12" fill="#475569">Các ổ trống âm nhỏ 1-5 mm rải rác trong cơ tử cung</text>

  <rect x="60" y="220" width="355" height="65" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="75" y="245" font-family="Arial" font-size="13" font-weight="bold" fill="#1E3A8A">2. Đảo tăng âm (Hyperechoic Islands)</text>
  <text x="75" y="267" font-family="Arial" font-size="12" fill="#475569">Các nốt tăng âm nhỏ hình thành từ mô đệm nội mạc lạc chỗ</text>

  <rect x="60" y="295" width="355" height="65" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="75" y="320" font-family="Arial" font-size="13" font-weight="bold" fill="#1E3A8A">3. Bóng lưng hình quạt (Fan-shaped Shadowing)</text>
  <text x="75" y="342" font-family="Arial" font-size="12" fill="#475569">Các dải bóng cản âm song song tỏa ra từ vùng cơ xơ hóa</text>

  <rect x="60" y="370" width="355" height="65" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="75" y="395" font-family="Arial" font-size="13" font-weight="bold" fill="#1E3A8A">4. Vệt tăng âm dưới nội mạc (Subendometrial Lines)</text>
  <text x="75" y="417" font-family="Arial" font-size="12" fill="#475569">Các đường chồi gai tăng âm đâm xuyên từ nội mạc vào cơ</text>

  <!-- Indirect Signs Box -->
  <rect x="465" y="70" width="395" height="390" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="662" y="105" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#92400E">DẤU HIỆU GIÁN TIẾP (INDIRECT SIGNS)</text>
  <text x="662" y="128" font-family="Arial" font-size="12" font-style="italic" text-anchor="middle" fill="#D97706">Có giá trị định hướng và gợi ý</text>

  <rect x="485" y="145" width="355" height="85" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="500" y="170" font-family="Arial" font-size="13" font-weight="bold" fill="#78350F">1. Dày cơ tử cung bất đối xứng</text>
  <text x="500" y="192" font-family="Arial" font-size="12" fill="#475569">Thành trước hoặc thành sau dày bất đối xứng rõ rệt</text>
  <text x="500" y="212" font-family="Arial" font-size="12" fill="#64748B">(Chênh lệch độ dày thành trước/sau &gt; 1.5 - 2 lần)</text>

  <rect x="485" y="240" width="355" height="85" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="500" y="265" font-family="Arial" font-size="13" font-weight="bold" fill="#78350F">2. Tử cung to hình cầu (Globular Uterus)</text>
  <text x="500" y="287" font-family="Arial" font-size="12" fill="#475569">Tử cung mất dạng thon quả lê, trở nên tròn căng</text>
  <text x="500" y="307" font-family="Arial" font-size="12" fill="#64748B">(Tăng kích thước theo đường kính trước - sau)</text>

  <rect x="485" y="335" width="355" height="100" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="500" y="360" font-family="Arial" font-size="13" font-weight="bold" fill="#78350F">3. Mạch máu xuyên cơ (Translesional Flow)</text>
  <text x="500" y="382" font-family="Arial" font-size="12" fill="#475569">Doppler màu: Mạch máu chạy thẳng góc đâm xuyên cơ</text>
  <text x="500" y="402" font-family="Arial" font-size="12" fill="#64748B">(Khác với U xơ tử cung mạch máu chạy vòng bao quanh)</text>
</svg>