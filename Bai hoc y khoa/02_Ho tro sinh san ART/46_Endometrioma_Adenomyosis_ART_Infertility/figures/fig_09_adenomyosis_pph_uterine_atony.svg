<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <rect width="100%" height="100%" fill="#FEF2F2"/>
  <text x="450" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#991B1B">CƠ CHẾ BĂNG HUYẾT SAU SINH (PPH) DO ĐỜ TỬ CUNG Ở ADENOMYOSIS</text>
  
  <!-- Left Box: Normal -->
  <rect x="40" y="70" width="390" height="370" rx="12" fill="#FFFFFF" stroke="#22C55E" stroke-width="2"/>
  <text x="235" y="105" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#15803D">TỬ CUNG BÌNH THƯỜNG</text>
  
  <rect x="60" y="130" width="350" height="85" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="75" y="155" font-family="Arial" font-size="13" font-weight="bold" fill="#166534">1. Cấu trúc cơ trơn đan chéo</text>
  <text x="75" y="177" font-family="Arial" font-size="12" fill="#334155">Mạng lưới sợi cơ trơn và collagen đàn hồi khỏe mạnh bao bọc xung quanh các nhánh động mạch xoắn</text>

  <rect x="60" y="230" width="350" height="85" rx="8" fill="#F0FDF4" stroke="#86EFAC"/>
  <text x="75" y="255" font-family="Arial" font-size="13" font-weight="bold" fill="#166534">2. Hiệu ứng "Nút thắt sống" (Living Ligatures)</text>
  <text x="75" y="277" font-family="Arial" font-size="12" fill="#334155">Ngay sau khi sổ rau, cơ tử cung co rút siết chặt cơ học bịt kín các mạch máu hở tại diện rau bám</text>

  <rect x="60" y="330" width="350" height="85" rx="8" fill="#DCFCE7" stroke="#4ADE80"/>
  <text x="235" y="360" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#15803D">KẾT QUẢ: CẦM MÁU SINH LÝ TỐT</text>
  <text x="235" y="385" font-family="Arial" font-size="12" text-anchor="middle" fill="#166534">Tử cung co hồi thành khối cầu an toàn</text>

  <!-- Right Box: Adenomyosis -->
  <rect x="470" y="70" width="390" height="370" rx="12" fill="#FFFFFF" stroke="#EF4444" stroke-width="2"/>
  <text x="665" y="105" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#B91C1C">TỬ CUNG ADENOMYOSIS</text>

  <rect x="490" y="130" width="350" height="85" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="505" y="155" font-family="Arial" font-size="13" font-weight="bold" fill="#991B1B">1. Tuyến lạc chỗ tiết MMPs &amp; PGE2</text>
  <text x="505" y="177" font-family="Arial" font-size="12" fill="#334155">Enzyme tiêu protein (MMPs) phá hủy cấu trúc collagen, cơ tử cung bị xơ hóa và thoái hóa sợi co rút</text>

  <rect x="490" y="230" width="350" height="85" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
  <text x="505" y="255" font-family="Arial" font-size="13" font-weight="bold" fill="#991B1B">2. Mất khả năng co rút ("Đờ tử cung")</text>
  <text x="505" y="277" font-family="Arial" font-size="12" fill="#334155">Cơ xơ cứng mất tính đàn hồi, các mạch máu hở tại diện rau không thể bịt kín lại được</text>

  <rect x="490" y="330" width="350" height="85" rx="8" fill="#FEE2E2" stroke="#F87171"/>
  <text x="665" y="360" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#991B1B">BĂNG HUYẾT SAU SINH Ồ ẠT (PPH)</text>
  <text x="665" y="385" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#B91C1C">Cần thuốc tăng co tích cực, bóng chèn Bakri / thắt mạch</text>
</svg>