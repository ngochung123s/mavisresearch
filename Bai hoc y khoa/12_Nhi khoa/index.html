<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>PedViewer · Nhi Khoa</title>
  <script>
    (function() {
      var saved = localStorage.getItem('ped_viewer_target');
      if (saved === 'desktop') {
        window.location.replace('app.html');
        return;
      }
      if (saved === 'mobile') {
        window.location.replace('mobile.html');
        return;
      }
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
      window.location.replace(isMobile ? 'mobile.html' : 'app.html');
    })();
  </script>
</head>
<body style="background:#000000;color:#94a3b8;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <div style="text-align:center;">
    <p style="font-size:15px;margin-bottom:8px;color:#38bdf8;">Đang mở PedViewer...</p>
    <p style="font-size:12px;color:#64748b;">
      <a href="mobile.html" style="color:#22d3ee;text-decoration:none;margin-right:12px;">Bản Điện Thoại</a>
      <a href="app.html" style="color:#94a3b8;text-decoration:none;">Bản Máy Tính</a>
    </p>
  </div>
</body>
</html>
