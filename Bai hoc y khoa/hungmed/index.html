<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#121214">
  <title>HungMed · Sổ Tay Lâm Sàng Nhi - Sản | BS. Đỗ Văn Ngọc Hưng</title>
  <script>
    (function() {
      var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
      var saved = localStorage.getItem('ped_viewer_target');
      var keep = window.location.search + window.location.hash; // giữ ?k=…&bai=… khi chuyển trang

      // Nếu trên điện thoại: Luôn ưu tiên bản mobile.html trừ khi có cờ ép buộc trên màn hình lớn
      if (isMobile) {
        if (saved === 'desktop' && window.innerWidth > 600) {
          window.location.replace('app.html' + keep);
          return;
        }
        window.location.replace('mobile.html' + keep);
        return;
      }

      if (saved === 'mobile') {
        window.location.replace('mobile.html' + keep);
        return;
      }

      window.location.replace('app.html' + keep);
    })();
  </script>
</head>
<body style="background:#121214;color:#a1a1aa;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <div style="text-align:center;">
    <p style="font-size:16px;font-weight:700;margin-bottom:4px;color:#38bdf8;">🩺 HungMed</p>
    <p style="font-size:12px;color:#a1a1aa;margin-bottom:14px;">BS. Đỗ Văn Ngọc Hưng · Sổ tay Lâm sàng Nhi - Sản</p>
    <p style="font-size:12px;color:#71717a;">
      <a href="mobile.html" style="color:#38bdf8;text-decoration:none;margin-right:16px;font-weight:600;">Bản Điện Thoại (Mobile)</a>
      <a href="app.html" style="color:#e4e4e7;text-decoration:none;">Bản Máy Tính (Desktop)</a>
    </p>
  </div>
</body>
</html>
